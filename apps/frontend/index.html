<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tokistack</title>
    <style>
    /* Initial CSS variables to avoid style flashes */
    :root {
      --background: oklch(1 0 0);
      --foreground: oklch(0.129 0.042 264.695);
      --muted: oklch(0.968 0.007 247.896);
      --muted-foreground: oklch(0.554 0.046 257.417);
    }
    .dark {
      --background: oklch(0.129 0.042 264.695);
      --foreground: oklch(98.415% 0.00352 248.585 / 0.86);
      --muted: oklch(0.279 0.041 260.031);
      --muted-foreground: oklch(0.704 0.04 256.788);
    }
    @media (prefers-color-scheme: dark) {
      :root:not(.light) {
        --background: oklch(0.129 0.042 264.695);
        --foreground: oklch(98.415% 0.00352 248.585 / 0.86);
        --muted: oklch(0.279 0.041 260.031);
        --muted-foreground: oklch(0.704 0.04 256.788);
      }
    }
    .bg-clip-text {
      -webkit-background-clip: text;
      background-clip: text;
    }
    .text-transparent {
      color: transparent;
    }
    .text-muted-foreground {
      color: var(--muted-foreground);
    }
    .from-foreground.to-foreground\/60.bg-linear-to-br {
      background-image: linear-gradient(
        to bottom right,
        var(--foreground),
        color-mix(in oklch, var(--foreground) 60%, transparent)
      );
    }
    .from-blue-500.to-indigo-600.bg-linear-to-br {
      background-image: linear-gradient(
        to bottom right,
        oklch(0.623 0.214 259.815),
        oklch(0.511 0.262 276.966)
      );
    }

    html, body, #app {
      background-color: oklch(1 0 0);
      margin: 0;
    }

    html.dark, html.dark body, html.dark #app {
      background-color: oklch(0.129 0.042 264.695);
    }

    @media (prefers-color-scheme: dark) {
      html:not(.light), html:not(.light) body, html:not(.light) #app {
        background-color: oklch(0.129 0.042 264.695);
      }
    }

    .blur-3xl {
      filter: blur(64px);
    }
    .blur-2xl {
      filter: blur(40px);
    }
    </style>
    <script>
    const stored = localStorage.getItem("vueuse-color-scheme");
      if (stored === "dark") {
        document.documentElement.classList.add("dark");
      } else if (stored === "light") {
        document.documentElement.classList.add("light");
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
